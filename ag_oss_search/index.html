<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgOSS Candidate Review</title>
<script src="candidates_data.js"></script>
<style>
:root {
  --bg: #f5f7fa;
  --surface: #ffffff;
  --border: #dee2e6;
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --text: #1e293b;
  --text-muted: #64748b;
  --radius: 6px;
  --shadow: 0 1px 3px rgba(0,0,0,.07);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
}
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── Header ── */
header {
  background: var(--primary);
  color: #fff;
  padding: .9rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}
header h1 { font-size: 1.15rem; font-weight: 600; }
header .sub { font-size: .78rem; opacity: .8; margin-top: .15rem; }
.sl-badge {
  background: rgba(255,255,255,.2);
  border: 1px solid rgba(255,255,255,.35);
  color: #fff;
  padding: .3rem .8rem;
  border-radius: 99px;
  font-size: .82rem;
  font-weight: 600;
  white-space: nowrap;
}
.sl-badge.has-items { background: #16a34a; border-color: #15803d; }

/* ── Toolbar ── */
.toolbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: .6rem 1.5rem;
  display: flex;
  align-items: center;
  gap: .75rem;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 20;
  box-shadow: var(--shadow);
}

#search {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: .38rem .75rem;
  font-size: .875rem;
  width: 210px;
  outline: none;
  transition: border-color .15s;
}
#search:focus { border-color: var(--primary); }

.kw-group { display: flex; gap: .25rem; }
.kw-btn {
  padding: .32rem .7rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  cursor: pointer;
  font-size: .78rem;
  font-weight: 600;
  color: var(--text-muted);
  transition: .12s;
  white-space: nowrap;
}
.kw-btn:hover { border-color: #94a3b8; color: var(--text); }
.kw-btn.active                       { background: var(--primary);  border-color: var(--primary);  color: #fff; }
.kw-btn[data-kw="agriculture"].active { background: #16a34a; border-color: #16a34a; }
.kw-btn[data-kw="agtech"].active      { background: #2563eb; border-color: #2563eb; }
.kw-btn[data-kw="farming"].active     { background: #d97706; border-color: #d97706; }

.toggle-label {
  display: flex;
  align-items: center;
  gap: .35rem;
  font-size: .82rem;
  color: var(--text-muted);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
.toggle-label input { accent-color: var(--primary); cursor: pointer; }

.vis-count { font-size: .82rem; color: var(--text-muted); white-space: nowrap; }
.vis-count strong { color: var(--text); }

.toolbar-actions { display: flex; gap: .4rem; margin-left: auto; }
.btn {
  padding: .32rem .7rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  cursor: pointer;
  font-size: .78rem;
  font-weight: 500;
  transition: .12s;
}
.btn:hover { background: var(--bg); border-color: #94a3b8; }
.btn-export {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.btn-export:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
.btn-danger:hover { background: #fee2e2; border-color: #fca5a5; color: #dc2626; }

/* ── Table ── */
.table-wrap { padding: 1rem 1.5rem 2rem; }
/* overflow:clip clips visually for border-radius without creating a scroll container,
   so position:sticky on thead still works (overflow:hidden would break it) */
.table-outer {
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: clip;
}
table {
  width: 100%;
  border-collapse: collapse;
  background: var(--surface);
}
thead { position: sticky; top: 53px; z-index: 10; }
th {
  background: #f8fafc;
  font-size: .72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .05em;
  color: var(--text-muted);
  padding: .55rem 1rem;
  text-align: left;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
td {
  padding: .5rem 1rem;
  border-bottom: 1px solid #f1f5f9;
  vertical-align: middle;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: #f8fafc; }
tr.shortlisted td { background: #f0fdf4; }
tr.shortlisted:hover td { background: #dcfce7; }
tr.hidden { display: none; }
/* row-hidden = user-hidden state (independent of the filter-driven .hidden
   above); only ever visible at all when "Show hidden" is on, and dimmed so
   it reads clearly as set aside rather than a normal row. */
tr.row-hidden td { opacity: .45; }
tr.row-hidden:hover td { opacity: .7; }

/* Column sizing */
.col-cb   { width: 36px; text-align: center; }
.col-rank { width: 54px; }
.col-kw   { width: 104px; }
.col-name { min-width: 240px; }
.col-num  { width: 76px; text-align: right; }
.col-date { width: 90px; text-align: right; }
.col-hide { width: 76px; text-align: center; }

.hide-btn {
  padding: .22rem .55rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  cursor: pointer;
  font-size: .72rem;
  font-weight: 500;
  color: var(--text-muted);
  transition: .12s;
  white-space: nowrap;
}
.hide-btn:hover { border-color: #94a3b8; color: var(--text); }
tr.row-hidden .hide-btn { background: var(--primary); border-color: var(--primary); color: #fff; }
tr.row-hidden .hide-btn:hover { background: var(--primary-dark); border-color: var(--primary-dark); }

input[type="checkbox"] {
  width: 15px; height: 15px;
  cursor: pointer;
  accent-color: var(--primary);
}
.rank-num {
  font-size: .78rem;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
.badge {
  display: inline-block;
  padding: .13rem .48rem;
  border-radius: 99px;
  font-size: .68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.badge-agriculture { background: #dcfce7; color: #15803d; }
.badge-agtech       { background: #dbeafe; color: #1e40af; }
.badge-farming      { background: #fef3c7; color: #92400e; }

.repo-name { font-weight: 500; font-size: .88rem; }
.repo-owner { font-size: .75rem; color: var(--text-muted); }
.num-cell {
  font-variant-numeric: tabular-nums;
  font-size: .82rem;
  color: var(--text-muted);
}
.date-cell { font-size: .78rem; color: var(--text-muted); }

/* ── Stats bar ── */
.stats-bar {
  display: flex;
  gap: .75rem;
  padding: .75rem 1.5rem;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: .6rem .9rem;
  min-width: 148px;
  box-shadow: var(--shadow);
}
.stat-card-header {
  margin-bottom: .45rem;
}
.stat-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: .75rem;
  font-size: .75rem;
  color: var(--text-muted);
  padding: .05rem 0;
}
.stat-row strong {
  font-variant-numeric: tabular-nums;
  color: var(--text);
  font-weight: 600;
}
.stat-row.final {
  border-top: 1px solid var(--border);
  margin-top: .35rem;
  padding-top: .35rem;
  color: var(--text);
  font-weight: 600;
}
.stat-row.final strong { color: var(--primary); }
.stat-card-total {
  border-color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: .2rem;
  text-align: center;
  min-width: 100px;
}
.stat-card-total .total-num {
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--primary);
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.stat-card-total .total-label {
  font-size: .72rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: .04em;
}

.empty-msg {
  text-align: center;
  padding: 3.5rem 1rem;
  color: var(--text-muted);
  font-size: .9rem;
  display: none;
}
</style>
</head>
<body>

<header>
  <div>
    <h1>AgOSS Candidate Repository Review</h1>
    <div class="sub" id="header-sub"></div>
  </div>
  <div class="sl-badge" id="sl-badge">0 shortlisted</div>
</header>

<div class="toolbar">
  <input type="search" id="search" placeholder="Filter by name…" autocomplete="off">

  <div class="kw-group">
    <button class="kw-btn active" data-kw="all">All</button>
    <button class="kw-btn" data-kw="agriculture">Agriculture</button>
    <button class="kw-btn" data-kw="agtech">Agtech</button>
    <button class="kw-btn" data-kw="farming">Farming</button>
  </div>

  <label class="toggle-label">
    <input type="checkbox" id="sl-only"> Shortlisted only
  </label>

  <label class="toggle-label">
    <input type="checkbox" id="show-hidden"> Show hidden (<span id="hidden-count">0</span>)
  </label>

  <span class="vis-count">
    Showing <strong id="vis-count">0</strong> of <strong id="total-count">0</strong>
  </span>

  <div class="toolbar-actions">
    <button class="btn" id="btn-unhide-all">Unhide all</button>
    <button class="btn btn-danger" id="btn-clear">Clear all</button>
    <button class="btn btn-export" id="btn-export">Export shortlist ↓</button>
  </div>
</div>

<div class="stats-bar" id="stats-bar"></div>

<div class="table-wrap">
  <div class="table-outer">
  <table>
    <thead>
      <tr>
        <th class="col-cb">✓</th>
        <th class="col-rank">Rank</th>
        <th class="col-kw">Keyword</th>
        <th class="col-name">Repository</th>
        <th class="col-num">Stars</th>
        <th class="col-num">Forks</th>
        <th class="col-date">Last Push</th>
        <th class="col-hide"></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  </div>
  <div class="empty-msg" id="empty-msg">No repositories match the current filters.</div>
</div>

<script>
// ── Guard ─────────────────────────────────────────────────────────────────────
if (typeof CANDIDATES === 'undefined') {
  document.body.innerHTML = `
    <div style="padding:4rem;text-align:center;font-family:sans-serif;color:#1e293b">
      <h2 style="margin-bottom:.75rem">candidates_data.js not found</h2>
      <p style="color:#64748b">
        Run <code style="background:#f1f5f9;padding:.2em .4em;border-radius:4px">
        python ag_oss_search/agoss_search.py</code> to generate it, then reopen this page.
      </p>
    </div>`;
  throw new Error('candidates_data.js missing');
}

// ── State ─────────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'agoss-shortlist-v1';
const HIDDEN_STORAGE_KEY = 'agoss-hidden-v1';
const meta = CANDIDATES.meta;

function loadShortlist() {
  try { return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')); }
  catch { return new Set(); }
}
function saveShortlist() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...shortlist]));
}

function loadHidden() {
  try { return new Set(JSON.parse(localStorage.getItem(HIDDEN_STORAGE_KEY) || '[]')); }
  catch { return new Set(); }
}
function saveHidden() {
  localStorage.setItem(HIDDEN_STORAGE_KEY, JSON.stringify([...hidden]));
}

let shortlist = loadShortlist();
let hidden    = loadHidden();
let activeKw = 'all';
let searchQ   = '';
let slOnly    = false;
let showHidden = false;

// merged already carries keyword + rank from the search script
const rows = CANDIDATES.merged;

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmtNum(n) {
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
  return n.toLocaleString();
}
function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('en-US', { year: 'numeric', month: 'short' });
}

// ── Stats bar ─────────────────────────────────────────────────────────────────
const KW_COLORS = { agriculture: '#15803d', agtech: '#1e40af', farming: '#92400e' };
const statsBar = document.getElementById('stats-bar');

(CANDIDATES.stats ? meta.keywords : []).forEach(kw => {
  const s = CANDIDATES.stats[kw];
  const card = document.createElement('div');
  card.className = 'stat-card';
  card.innerHTML = `
    <div class="stat-card-header">
      <span class="badge badge-${kw}">${kw}</span>
    </div>
    <div class="stat-row"><span>Fetched</span><strong>${s.fetched}</strong></div>
    <div class="stat-row"><span>Archived filtered</span><strong>${s.archived_filtered}</strong></div>
    <div class="stat-row"><span>Fork filtered</span><strong>${s.fork_filtered}</strong></div>
    <div class="stat-row"><span>Cross-keyword dupes</span><strong>${s.duplicates}</strong></div>
    <div class="stat-row final"><span>Unique</span><strong>${s.final}</strong></div>
  `;
  statsBar.appendChild(card);
});

const totalCard = document.createElement('div');
totalCard.className = 'stat-card stat-card-total';
totalCard.innerHTML = `
  <div class="total-num">${meta.total_unique}</div>
  <div class="total-label">Total unique repos</div>
`;
statsBar.appendChild(totalCard);

// ── Header ────────────────────────────────────────────────────────────────────
const genDate = new Date(meta.generated_at).toLocaleString('en-US', {
  month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit'
});
document.getElementById('header-sub').textContent =
  `Generated ${genDate} · Sort: ${meta.sort} · ${meta.n_per_keyword} per keyword · ${meta.total_unique} total`;
document.getElementById('total-count').textContent = rows.length;

// ── Build table ───────────────────────────────────────────────────────────────
const tbody = document.getElementById('tbody');

rows.forEach(repo => {
  const slash = repo.name.indexOf('/');
  const owner = repo.name.slice(0, slash);
  const rname = repo.name.slice(slash + 1);
  const checked = shortlist.has(repo.name);
  const isHidden = hidden.has(repo.name);

  const tr = document.createElement('tr');
  tr.dataset.name = repo.name;
  tr.dataset.kw   = repo.keyword;
  if (checked) tr.classList.add('shortlisted');
  if (isHidden) tr.classList.add('row-hidden');

  tr.innerHTML = `
    <td class="col-cb">
      <input type="checkbox" data-name="${repo.name}"${checked ? ' checked' : ''}>
    </td>
    <td class="col-rank"><span class="rank-num">#${repo.rank}</span></td>
    <td class="col-kw"><span class="badge badge-${repo.keyword}">${repo.keyword}</span></td>
    <td class="col-name">
      <div class="repo-name"><a href="${repo.url}" target="_blank" rel="noopener">${rname}</a></div>
      <div class="repo-owner">${owner}</div>
    </td>
    <td class="col-num num-cell">⭐ ${fmtNum(repo.stars)}</td>
    <td class="col-num num-cell">${fmtNum(repo.forks)}</td>
    <td class="col-date date-cell">${fmtDate(repo.pushed_at)}</td>
    <td class="col-hide">
      <button class="hide-btn" data-name="${repo.name}">${isHidden ? 'Unhide' : 'Hide'}</button>
    </td>
  `;
  tbody.appendChild(tr);
});

// ── Checkbox handler ──────────────────────────────────────────────────────────
tbody.addEventListener('change', e => {
  if (e.target.type !== 'checkbox') return;
  const name = e.target.dataset.name;
  const tr   = e.target.closest('tr');
  if (e.target.checked) {
    shortlist.add(name);
    tr.classList.add('shortlisted');
  } else {
    shortlist.delete(name);
    tr.classList.remove('shortlisted');
    if (slOnly) tr.classList.add('hidden');
  }
  saveShortlist();
  updateBadge();
  updateVisCount();
});

// ── Hide/unhide handler ───────────────────────────────────────────────────────
// Independent of the shortlist checkbox above — this just declutters the view
// (e.g. repos already triaged out) without affecting the shortlist selection.
tbody.addEventListener('click', e => {
  const btn = e.target.closest('.hide-btn');
  if (!btn) return;
  const name = btn.dataset.name;
  const tr = btn.closest('tr');
  const nowHidden = !hidden.has(name);
  if (nowHidden) hidden.add(name); else hidden.delete(name);
  tr.classList.toggle('row-hidden', nowHidden);
  btn.textContent = nowHidden ? 'Unhide' : 'Hide';
  saveHidden();
  updateHiddenCount();
  applyFilters();
});

// ── Filter ────────────────────────────────────────────────────────────────────
function applyFilters() {
  let vis = 0;
  tbody.querySelectorAll('tr').forEach(tr => {
    const kwOk   = activeKw === 'all' || tr.dataset.kw === activeKw;
    const srOk   = !searchQ  || tr.dataset.name.toLowerCase().includes(searchQ);
    const slOk   = !slOnly   || shortlist.has(tr.dataset.name);
    const hideOk = showHidden || !hidden.has(tr.dataset.name);
    const show   = kwOk && srOk && slOk && hideOk;
    tr.classList.toggle('hidden', !show);
    if (show) vis++;
  });
  document.getElementById('vis-count').textContent = vis;
  document.getElementById('empty-msg').style.display = vis === 0 ? 'block' : 'none';
}

function updateHiddenCount() {
  document.getElementById('hidden-count').textContent = hidden.size;
}

function updateVisCount() {
  let vis = 0;
  tbody.querySelectorAll('tr:not(.hidden)').forEach(() => vis++);
  document.getElementById('vis-count').textContent = vis;
}

function updateBadge() {
  const n   = shortlist.size;
  const el  = document.getElementById('sl-badge');
  el.textContent = `${n} shortlisted`;
  el.classList.toggle('has-items', n > 0);
}
updateBadge();
updateHiddenCount();

// ── Controls ──────────────────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', e => {
  searchQ = e.target.value.trim().toLowerCase();
  applyFilters();
});

document.querySelectorAll('.kw-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.kw-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeKw = btn.dataset.kw;
    applyFilters();
  });
});

document.getElementById('sl-only').addEventListener('change', e => {
  slOnly = e.target.checked;
  applyFilters();
});

document.getElementById('show-hidden').addEventListener('change', e => {
  showHidden = e.target.checked;
  applyFilters();
});

document.getElementById('btn-unhide-all').addEventListener('click', () => {
  if (hidden.size === 0) return;
  if (!confirm(`Unhide all ${hidden.size} hidden repos?`)) return;
  hidden.clear();
  saveHidden();
  tbody.querySelectorAll('tr.row-hidden').forEach(tr => {
    tr.classList.remove('row-hidden');
    tr.querySelector('.hide-btn').textContent = 'Hide';
  });
  updateHiddenCount();
  applyFilters();
});

document.getElementById('btn-clear').addEventListener('click', () => {
  if (shortlist.size === 0) return;
  if (!confirm(`Remove all ${shortlist.size} repos from the shortlist?`)) return;
  shortlist.clear();
  saveShortlist();
  tbody.querySelectorAll('input[type="checkbox"]').forEach(cb => { cb.checked = false; });
  tbody.querySelectorAll('tr.shortlisted').forEach(tr => tr.classList.remove('shortlisted'));
  updateBadge();
  applyFilters();
});

document.getElementById('btn-export').addEventListener('click', () => {
  const selected = rows.filter(r => shortlist.has(r.name));
  if (selected.length === 0) { alert('Nothing shortlisted yet.'); return; }
  const payload = JSON.stringify({ count: selected.length, repos: selected }, null, 2);
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([payload], { type: 'application/json' })),
    download: 'shortlist.json',
  });
  a.click();
});

applyFilters();
</script>
</body>
</html>
